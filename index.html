<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171717"><title>Analog Lab</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><style>body{margin:0;background:#171717;color:#eee;font:16px system-ui}main{max-width:760px;margin:auto;padding:18px}h1{font-size:25px}canvas{width:100%;height:auto;background:#333;border-radius:10px}label{display:block;margin:16px 0 6px}input[type=range],select{width:100%}button,.file{display:inline-block;padding:12px 16px;border:0;border-radius:9px;background:#e2e2e2;color:#111;font-weight:600;margin:8px 6px 8px 0}input[type=file]{max-width:100%}small{color:#aaa}</style></head><body><main><h1>Analog Lab <small>0.3</small></h1><p>Локальная фотолаборатория. Фото не отправляются на сервер. Эта версия работает из одного HTML-файла.</p><label>Открыть фотографию</label><input type="file" id="file" accept="image/*"><label>Процесс</label><select id="mode"><option value="silver">Серебряный ЧБ</option><option value="cyan">Цианотипия</option><option value="color">Цветная негативная плёнка</option></select><label>Контраст: <output id="cv">0</output></label><input id="contrast" type="range" min="-100" max="100" value="0"><label>Зерно: <output id="gv">20</output></label><input id="grain" type="range" min="0" max="100" value="20"><label>Интенсивность: <output id="iv">100</output></label><input id="intensity" type="range" min="0" max="100" value="100"><canvas id="canvas" width="900" height="600"></canvas><p><button id="save">Сохранить JPEG</button><button id="reset">Сбросить настройки</button></p><small>Предпросмотр до 1600 пикселей по длинной стороне; экспорт использует это же разрешение. Эффекты — художественные имитации, не точная физическая модель.</small></main><script>const $=id=>document.getElementById(id),c=$('canvas'),ctx=c.getContext('2d',{willReadFrequently:true});let original=null,seed=12345;const controls=['mode','contrast','grain','intensity'];function noise(x,y){let n=(Math.imul(x+seed,374761393)+Math.imul(y,668265263))|0;n=Math.imul(n^(n>>>13),1274126177);return ((n^(n>>>16))>>>0)/4294967295-.5}function clamp(v){return Math.max(0,Math.min(255,v))}function draw(){if(!original)return;let out=new ImageData(new Uint8ClampedArray(original.data),original.width,original.height),a=out.data,b=original.data,mode=$('mode').value,contrast=+$('contrast').value/100,grain=+$('grain').value/100,intensity=+$('intensity').value/100;for(let y=0;y<out.height;y++)for(let x=0;x<out.width;x++){let i=(y*out.width+x)*4,r=b[i],g=b[i+1],bl=b[i+2],l=.25*r+.66*g+.09*bl;let target;if(mode==='silver')target=[l,l,l];else if(mode==='cyan'){let t=l/255;target=[16+135*t,48+164*t,75+170*t]}else{target=[r*1.04+7,g*.99+3,bl*.91+10]}let n=noise(x,y)*grain*72;for(let k=0;k<3;k++){let v=b[i+k]*(1-intensity)+target[k]*intensity;v=(v-127.5)*(1+contrast*.8)+127.5+n*intensity;a[i+k]=clamp(v)}}ctx.putImageData(out,0,0);$('cv').textContent=$('contrast').value;$('gv').textContent=$('grain').value;$('iv').textContent=$('intensity').value}function loadImage(file){if(!file)return;let im=new Image();im.onload=()=>{let s=Math.min(1,1600/Math.max(im.width,im.height));c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));ctx.drawImage(im,0,0,c.width,c.height);original=ctx.getImageData(0,0,c.width,c.height);draw()};im.onerror=()=>{alert('Не удалось открыть файл. Попробуйте JPEG или PNG.')};let reader=new FileReader();reader.onload=()=>{im.src=reader.result};reader.onerror=()=>alert('Не удалось прочитать файл');reader.readAsDataURL(file)}$('file').addEventListener('change',e=>loadImage(e.target.files[0]));controls.forEach(id=>$(id).addEventListener('input',draw));$('reset').onclick=()=>{$('mode').value='silver';$('contrast').value=0;$('grain').value=20;$('intensity').value=100;draw()};$('save').onclick=()=>{if(!original){alert('Сначала откройте фотографию');return}c.toBlob(blob=>{if(!blob)return;let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='analog-lab.jpg';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)},'image/jpeg',.94)};
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});</script></body></html>
